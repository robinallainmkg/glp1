# Nginx reverse proxy pour n8n — GLP1 France
# Fichier à copier dans /etc/nginx/sites-available/n8n
# Puis : ln -sf /etc/nginx/sites-available/n8n /etc/nginx/sites-enabled/
# Puis : certbot --nginx -d n8n.glp1-france.fr

upstream n8n_backend {
    server 127.0.0.1:5678;
    keepalive 64;
}

server {
    listen 80;
    server_name n8n.glp1-france.fr;

    # Certbot ajoutera la config SSL automatiquement

    # Taille max des uploads (workflows importés, etc.)
    client_max_body_size 50M;

    location / {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;

        # WebSocket support (nécessaire pour l'UI n8n)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers standard
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Désactiver le buffering pour le streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeouts adaptés aux workflows longs
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://n8n_backend/healthz;
        access_log off;
    }
}
