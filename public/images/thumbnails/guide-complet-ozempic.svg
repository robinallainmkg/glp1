<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <dropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <g opacity="0.05">
    <circle cx="100" cy="100" r="80" fill="#3b82f6"/>
    <circle cx="1100" cy="530" r="60" fill="#1d4ed8"/>
    <circle cx="200" cy="500" r="40" fill="#3b82f6"/>
    <circle cx="1000" cy="150" r="50" fill="#1d4ed8"/>
  </g>

  <g transform="translate(80, 80)">
    <circle cx="60" cy="60" r="50" fill="white" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
    <g stroke="#3b82f6" stroke-width="4" fill="none">
      <line x1="60" y1="35" x2="60" y2="85"/>
      <line x1="35" y1="60" x2="85" y2="60"/>
    </g>
    <circle cx="35" cy="35" r="3" fill="#10b981"/>
    <circle cx="85" cy="35" r="3" fill="#10b981"/>
    <circle cx="35" cy="85" r="3" fill="#10b981"/>
    <circle cx="85" cy="85" r="3" fill="#10b981"/>
  </g>

  <text x="200" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGradient)">
    Guide Complet Ozempic
  </text>

  <text x="200" y="170" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">
    Traitement GLP-1 pour le diabète et la perte de poids
  </text>

  <g transform="translate(200, 220)">
    <g>
      <rect x="0" y="0" width="180" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">💰 Prix moyen</text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3b82f6">18-25 €/mois</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">avec mutuelle</text>
    </g>

    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">💉 Fréquence</text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3b82f6">1 injection/semaine</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">stylo prérempli</text>
    </g>

    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">⚖️ Perte de poids</text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#10b981">15-20 kg</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">en 6-12 mois</text>
    </g>

    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">📈 Efficacité</text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b">HbA1c -2%</text>
      <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">diabète de type 2</text>
    </g>
  </g>

  <g transform="translate(200, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">
      ✅ Avantages principaux
    </text>

    <g transform="translate(0, 30)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="#374151">Contrôle glycémique optimal</text>
    </g>

    <g transform="translate(0, 60)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="#374151">Perte de poids significative</text>
    </g>

    <g transform="translate(0, 90)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="#374151">Une injection hebdomadaire</text>
    </g>

    <g transform="translate(400, 30)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="#374151">Réduction du risque cardiovasculaire</text>
    </g>

    <g transform="translate(400, 60)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="16" fill="#374151">Tolérance généralement bonne</text>
    </g>
  </g>

  <line x1="200" y1="480" x2="1000" y2="480" stroke="#e5e7eb" stroke-width="2"/>

  <g transform="translate(200, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3b82f6">
      🔍 Découvrez le guide complet sur GLP1-France.fr
    </text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
      Informations médicales validées • Conseils personnalisés • Suivi expert
    </text>
  </g>

  <g transform="translate(900, 570)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6">
      GLP1-France.fr
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
      Votre guide santé spécialisé
    </text>
  </g>
</svg>
