<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Comparatif des retraites yoga et perte de poids en France : prix et programmes">
  <defs>
    <linearGradient id="bgyoga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3c34"/>
      <stop offset="1" stop-color="#0f2620"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgyoga)"/>

  <!-- soleil levant -->
  <circle cx="640" cy="300" r="120" fill="#16a34a" opacity="0.16"/>
  <circle cx="640" cy="300" r="78" fill="#16a34a" opacity="0.2"/>

  <!-- silhouette assise en lotus, construite en formes simples -->
  <g transform="translate(640 268)">
    <circle cx="0" cy="-74" r="22" fill="#e8f5ee"/>
    <path d="M0 -50 C-16 -46 -24 -30 -24 -8 L-24 22 C-24 30 -16 36 0 36 C16 36 24 30 24 22 L24 -8 C24 -30 16 -46 0 -50 Z" fill="#e8f5ee"/>
    <path d="M-24 6 C-52 12 -66 26 -70 40 L-16 40 Z" fill="#e8f5ee"/>
    <path d="M24 6 C52 12 66 26 70 40 L16 40 Z" fill="#e8f5ee"/>
    <path d="M-70 40 Q0 62 70 40 L70 48 Q0 70 -70 48 Z" fill="#16a34a"/>
  </g>

  <!-- barres comparatives de prix (3 durees) -->
  <g stroke-linecap="round" stroke="#e8f5ee">
    <line x1="72" y1="286" x2="180" y2="286" stroke-width="14" opacity="0.5"/>
    <line x1="72" y1="318" x2="236" y2="318" stroke-width="14" opacity="0.72"/>
    <line x1="72" y1="350" x2="300" y2="350" stroke-width="14" stroke="#16a34a"/>
  </g>
  <text x="72" y="264" font-family="Georgia, serif" font-size="22" fill="#8fd8b0">3 jours · 4 jours · 1 semaine</text>

  <text x="60" y="104" font-family="Georgia, serif" font-size="46" fill="#ffffff" font-weight="bold">Retraite yoga</text>
  <text x="60" y="152" font-family="Georgia, serif" font-size="30" fill="#8fd8b0">Perte de poids : prix &amp; réalité</text>
  <text x="60" y="416" font-family="Georgia, serif" font-size="26" fill="#e8f5ee" opacity="0.85">Prix 2026 vérifiés · ce que dit la science</text>
</svg>
