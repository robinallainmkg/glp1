<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Prix Wegovy et Mounjaro en Espagne vs France 2026">
  <defs>
    <linearGradient id="bgEs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3c34"/>
      <stop offset="1" stop-color="#0f2620"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgEs)"/>
  <!-- route / frontière stylisée -->
  <path d="M0 330 Q 200 290 400 320 T 800 300" stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="14 10" opacity="0.7"/>
  <!-- panneau France -->
  <g transform="translate(120,150)">
    <rect x="-70" y="-34" width="140" height="68" rx="12" fill="#16a34a"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">FRANCE</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="18" fill="#eafff2" text-anchor="middle">remboursé 65 %</text>
    <rect x="-8" y="34" width="16" height="60" fill="#0f2620"/>
  </g>
  <!-- panneau Espagne -->
  <g transform="translate(600,170)">
    <rect x="-78" y="-34" width="156" height="68" rx="12" fill="#ffffff"/>
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a3c34" text-anchor="middle">ESPAGNE</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="18" fill="#4b5f58" text-anchor="middle">0 % financé</text>
    <rect x="-8" y="34" width="16" height="60" fill="#0f2620"/>
  </g>
  <!-- stylo injecteur -->
  <g transform="translate(368,180) rotate(18)">
    <rect x="-10" y="-70" width="20" height="120" rx="9" fill="#e8f5ee"/>
    <rect x="-10" y="-70" width="20" height="26" rx="9" fill="#16a34a"/>
    <rect x="-3" y="50" width="6" height="22" fill="#cfe8da"/>
  </g>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">Wegovy &amp; Mounjaro en Espagne</text>
  <text x="400" y="108" font-family="Arial, sans-serif" font-size="24" fill="#a7d9bf" text-anchor="middle">Prix réels 2026 · ce qui est légal</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="20" fill="#7fb99c" text-anchor="middle">Comparatif sourcé — GLP-1 France</text>
</svg>
