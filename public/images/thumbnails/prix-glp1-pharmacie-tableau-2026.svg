<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tableau des prix des GLP-1 en pharmacie 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3c34"/>
      <stop offset="1" stop-color="#0f2721"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="130" fill="#16a34a" opacity="0.12"/>
  <circle cx="80" cy="400" r="90" fill="#16a34a" opacity="0.10"/>
  <!-- Tableau stylisé -->
  <g transform="translate(90,120)">
    <rect x="0" y="0" width="380" height="230" rx="14" fill="#ffffff" opacity="0.97"/>
    <rect x="0" y="0" width="380" height="46" rx="14" fill="#16a34a"/>
    <rect x="0" y="32" width="380" height="14" fill="#16a34a"/>
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Médicament</text>
    <text x="250" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Prix / mois</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1a3c34">
      <text x="20" y="78">Ozempic</text><text x="250" y="78" font-weight="700">77,60 €</text>
      <line x1="14" y1="92" x2="366" y2="92" stroke="#e5e7eb" stroke-width="1"/>
      <text x="20" y="118">Wegovy</text><text x="250" y="118" font-weight="700">146,91 €+</text>
      <line x1="14" y1="132" x2="366" y2="132" stroke="#e5e7eb" stroke-width="1"/>
      <text x="20" y="158">Mounjaro</text><text x="250" y="158" font-weight="700">176,10 €+</text>
      <line x1="14" y1="172" x2="366" y2="172" stroke="#e5e7eb" stroke-width="1"/>
      <text x="20" y="198">Saxenda</text><text x="250" y="198" font-weight="700">~270 €</text>
    </g>
  </g>
  <!-- Croix pharmacie -->
  <g transform="translate(560,180)">
    <rect x="40" y="0" width="40" height="120" rx="8" fill="#16a34a"/>
    <rect x="0" y="40" width="120" height="40" rx="8" fill="#16a34a"/>
  </g>
  <text x="90" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Prix des GLP-1 en pharmacie</text>
  <text x="90" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#a7f3d0">Le tableau complet 2026 — prix officiels sourcés</text>
</svg>
