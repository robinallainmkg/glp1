<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ozempic sans ordonnance : illégal et dangereux en France">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3c34"/>
      <stop offset="100%" stop-color="#0f2d25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Stylo injecteur stylisé -->
  <g transform="translate(150,140) rotate(18)">
    <rect x="0" y="0" width="300" height="52" rx="26" fill="#f0fdf4"/>
    <rect x="238" y="6" width="56" height="40" rx="8" fill="#16a34a"/>
    <rect x="16" y="18" width="150" height="16" rx="4" fill="#d1d5db"/>
    <rect x="-38" y="18" width="42" height="16" rx="4" fill="#e5e7eb"/>
  </g>
  <!-- Panneau interdiction -->
  <g transform="translate(520,120)">
    <circle cx="80" cy="80" r="78" fill="none" stroke="#dc2626" stroke-width="16"/>
    <line x1="26" y1="26" x2="134" y2="134" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- Ordonnance -->
  <g transform="translate(90,240)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#ffffff"/>
    <rect x="16" y="20" width="70" height="10" rx="5" fill="#16a34a"/>
    <rect x="16" y="44" width="98" height="8" rx="4" fill="#d1d5db"/>
    <rect x="16" y="62" width="98" height="8" rx="4" fill="#d1d5db"/>
    <rect x="16" y="80" width="72" height="8" rx="4" fill="#d1d5db"/>
    <text x="16" y="135" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#16a34a">Rx</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Ozempic sans ordonnance ?</text>
  <text x="400" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#86efac">Illégal en France — et dangereux</text>
</svg>
