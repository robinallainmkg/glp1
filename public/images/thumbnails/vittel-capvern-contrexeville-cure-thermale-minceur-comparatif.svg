<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Comparatif cures thermales minceur Vittel Capvern Contrexéville">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3c34"/>
      <stop offset="1" stop-color="#0f2620"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- trois gouttes thermales comparées -->
  <g>
    <path d="M200 90 c-40 56 -62 92 -62 126 a62 62 0 0 0 124 0 c0 -34 -22 -70 -62 -126 z" fill="#16a34a"/>
    <path d="M400 70 c-46 64 -70 104 -70 142 a70 70 0 0 0 140 0 c0 -38 -24 -78 -70 -142 z" fill="#e8f5ee"/>
    <path d="M600 90 c-40 56 -62 92 -62 126 a62 62 0 0 0 124 0 c0 -34 -22 -70 -62 -126 z" fill="#16a34a" opacity="0.65"/>
  </g>
  <!-- barres comparatives sous les gouttes -->
  <g stroke-linecap="round">
    <line x1="160" y1="312" x2="240" y2="312" stroke="#e8f5ee" stroke-width="10" opacity="0.8"/>
    <line x1="352" y1="312" x2="448" y2="312" stroke="#16a34a" stroke-width="10"/>
    <line x1="566" y1="312" x2="634" y2="312" stroke="#e8f5ee" stroke-width="10" opacity="0.55"/>
  </g>
  <!-- coche comparatif -->
  <path d="M388 190 l16 18 l30 -34" stroke="#1a3c34" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="392" font-family="Georgia, serif" font-size="38" fill="#e8f5ee" font-weight="bold">Vittel · Capvern · Contrexéville</text>
  <text x="60" y="428" font-family="Georgia, serif" font-size="24" fill="#16a34a">3 cures thermales minceur comparées — 2026</text>
</svg>
