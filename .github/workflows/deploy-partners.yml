name: Deploy Partners Preview

on:
  push:
    branches: [ partners ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'astro.config.mjs'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: deploy-partners
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Astro site
      run: npm run astro:build

    - name: Deploy to /demo/ subfolder via lftp
      run: |
        sudo apt-get install -y -qq lftp > /dev/null 2>&1

        for ATTEMPT in 1 2 3; do
          echo "=== Deploy attempt $ATTEMPT/3 ==="
          lftp -u u403023291,${{ secrets.FTP_PASSWORD }} ftp://147.79.98.140 -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 20;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 2;
            set mirror:parallel-transfer-count 1;
            set mirror:use-pget-n 1;
            set ftp:sync-mode off;
            set xfer:clobber yes;
            mirror --reverse --delete --only-newer --verbose --no-perms --parallel=1 ./dist/ /domains/glp1-france.fr/public_html/demo/;
            quit
          " && echo "Deploy SUCCESS on attempt $ATTEMPT" && exit 0

          echo "Attempt $ATTEMPT failed, waiting 15s..."
          sleep 15
        done

        echo "All 3 deploy attempts failed"
        exit 1

    - name: Verify deployment
      if: success()
      run: |
        sleep 5
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://glp1-france.fr/demo/)
        echo "Demo site status: $STATUS"
