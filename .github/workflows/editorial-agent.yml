name: "Agent Editorial GLP1"

on:
  # Exécution quotidienne à 9h (Paris)
  schedule:
    - cron: "0 8 * * *"

  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre max de corrections à rédiger (0 = toutes)"
        required: false
        default: "0"
      id:
        description: "UUID d'un item editorial_queue spécifique (optionnel)"
        required: false
        default: ""

jobs:
  editorial:
    name: "Rédaction des corrections"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution de l'agent éditorial
        id: editorial
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.id }}" != "" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.id }}"
          fi
          node scripts/editorial-agent.mjs $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
