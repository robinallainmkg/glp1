name: "Insert Validator Results"

on:
  workflow_dispatch:
    inputs:
      run_note:
        description: "Note for this validation run"
        required: false
        default: "manual_run"

jobs:
  insert:
    name: "Insert validation results into Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Insert validation results
        run: |
          node - <<'EOF'
          const { createClient } = require('@supabase/supabase-js');

          // Service role key bypasses RLS — this is the correct approach for agents
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } }
          );

          async function main() {
            // ================================================================
            // STEP 1: Create agent_run
            // ================================================================
            console.log('=== STEP 1: Creating agent_run ===');
            const { data: runData, error: runError } = await supabase
              .from('agent_runs')
              .insert({
                agent_name: 'validator',
                status: 'started',
                metadata: { source: 'manual_run' }
              })
              .select('id')
              .single();

            if (runError) {
              console.error('Failed to create agent_run:', runError.message);
              process.exit(1);
            }
            const RUN_ID = runData.id;
            console.log('agent_run created, RUN_ID =', RUN_ID);

            // ================================================================
            // STEP 2: Build OK
            // ================================================================
            console.log('\n=== STEP 2: Build OK ===');
            const { error: buildErr } = await supabase.from('validation_results').insert({
              agent_run_id: RUN_ID,
              article_slug: '_global',
              check_type: 'build',
              severity: 'pass',
              message: 'Build Astro réussi sans erreur — 165 pages générées'
            });
            if (buildErr) console.error('Build insert error:', buildErr.message);
            else console.log('Build OK inserted');

            // ================================================================
            // STEP 3a: frontmatter warnings — mainKeyword manquant (14 articles)
            // ================================================================
            console.log('\n=== STEP 3a: frontmatter warnings (mainKeyword manquant) ===');
            const missingKeywordSlugs = [
              'acupuncture-glp1',
              'alternatives-bio-glp1',
              'alternatives-naturelles-ozempic',
              'berberine-glp1',
              'cannelle-glp1',
              'chrome-diabete',
              'homeopathie-diabete',
              'meditation-glp1',
              'peut-on-guerir-du-diabete',
              'phytotherapie-glp1',
              'plantes-diabete',
              'semaglutide-naturel',
              'supplements-glp1',
              'vinaigre-cidre-glp1'
            ];

            for (const slug of missingKeywordSlugs) {
              const { error } = await supabase.from('validation_results').insert({
                agent_run_id: RUN_ID,
                article_slug: slug,
                check_type: 'frontmatter',
                severity: 'warning',
                message: 'Champ mainKeyword absent ou vide',
                details: { field: 'mainKeyword' }
              });
              if (error) console.error(`  ${slug}: ${error.message}`);
              else console.log(`  OK: ${slug}`);
            }

            // ================================================================
            // STEP 3b: seo_meta warnings — description trop courte (6 articles)
            // ================================================================
            console.log('\n=== STEP 3b: seo_meta warnings (description trop courte) ===');
            const shortDescriptions = [
              { slug: 'acupuncture-glp1', length: 90 },
              { slug: 'alternatives-bio-glp1', length: 95 },
              { slug: 'cannelle-glp1', length: 87 },
              { slug: 'homeopathie-diabete', length: 92 },
              { slug: 'phytotherapie-glp1', length: 92 },
              { slug: 'plantes-diabete', length: 88 }
            ];

            for (const { slug, length } of shortDescriptions) {
              const { error } = await supabase.from('validation_results').insert({
                agent_run_id: RUN_ID,
                article_slug: slug,
                check_type: 'seo_meta',
                severity: 'warning',
                message: 'Description trop courte (< 120 caractères)',
                details: { field: 'description', current_length: length, min_required: 120 }
              });
              if (error) console.error(`  ${slug}: ${error.message}`);
              else console.log(`  OK: ${slug} (${length} chars)`);
            }

            // ================================================================
            // STEP 3c: seo_meta warning — titre trop long (1 article)
            // ================================================================
            console.log('\n=== STEP 3c: seo_meta warning (titre trop long) ===');
            const { error: titleErr } = await supabase.from('validation_results').insert({
              agent_run_id: RUN_ID,
              article_slug: 'peut-on-guerir-du-diabete',
              check_type: 'seo_meta',
              severity: 'warning',
              message: 'Titre trop long (68 chars, max 65)',
              details: { field: 'title', current_length: 68, max_allowed: 65 }
            });
            if (titleErr) console.error('Title insert error:', titleErr.message);
            else console.log('OK: peut-on-guerir-du-diabete (title too long)');

            // ================================================================
            // STEP 3d: seo_meta warnings — mainKeyword absent de la description (6 articles)
            // ================================================================
            console.log('\n=== STEP 3d: seo_meta warnings (mainKeyword absent de la description) ===');
            const keywordNotInDescSlugs = [
              'avant-apres-glp1-resultats-reels',
              'glp1-depression-apathie-sante-mentale',
              'glp1-benefices-cardiovasculaires-coeur',
              'centres-mounjaro-france',
              'mounjaro-dosage',
              'nouveaux-glp1-orforglipron-cagrisema-2026'
            ];

            for (const slug of keywordNotInDescSlugs) {
              const { error } = await supabase.from('validation_results').insert({
                agent_run_id: RUN_ID,
                article_slug: slug,
                check_type: 'seo_meta',
                severity: 'warning',
                message: 'Le mainKeyword ne figure pas dans la description'
              });
              if (error) console.error(`  ${slug}: ${error.message}`);
              else console.log(`  OK: ${slug}`);
            }

            // ================================================================
            // STEP 4: Create correction_tickets for the 14 articles with missing mainKeyword
            // ================================================================
            console.log('\n=== STEP 4: Creating correction_tickets ===');
            // Articles table uses full slugs with collection prefix (e.g. alternatives-glp1/acupuncture-glp1)
            const fullSlugs = missingKeywordSlugs.map(s => `alternatives-glp1/${s}`);
            const { data: articles, error: articlesErr } = await supabase
              .from('articles')
              .select('id, slug')
              .in('slug', fullSlugs)
              .eq('is_active', true);

            if (articlesErr) {
              console.error('Failed to fetch articles:', articlesErr.message);
            } else {
              console.log(`Found ${articles.length} articles in DB`);
              let ticketsCreated = 0;
              for (const article of articles) {
                const { error: ticketErr } = await supabase.from('correction_tickets').insert({
                  article_id: article.id,
                  slug: article.slug,
                  source_agent: 'validator',
                  ticket_type: 'seo_issue',
                  urgence: 'warning',
                  before_exact: 'Champ mainKeyword absent ou vide dans le frontmatter',
                  after_suggested: "Ajouter un mainKeyword pertinent correspondant au sujet principal de l'article",
                  claim_original: 'mainKeyword manquant',
                  realite_actuelle: "Le champ mainKeyword est requis pour le SEO — il est utilisé pour vérifier la cohérence title/description et optimiser le ciblage keyword.",
                  statut: 'approved'
                });
                if (ticketErr) console.error(`  Ticket ${article.slug}: ${ticketErr.message}`);
                else {
                  console.log(`  OK ticket: ${article.slug}`);
                  ticketsCreated++;
                }
              }
              console.log(`Tickets created: ${ticketsCreated}`);

              // ================================================================
              // STEP 5: Finalize agent_run
              // ================================================================
              console.log('\n=== STEP 5: Finalizing agent_run ===');
              const { error: updateErr } = await supabase
                .from('agent_runs')
                .update({
                  status: 'completed',
                  completed_at: new Date().toISOString(),
                  items_processed: 87,
                  items_errors: 0,
                  metadata: {
                    articles_checked: 87,
                    errors: 0,
                    warnings: 26,
                    infos: 0,
                    build_ok: true,
                    duplicates_found: 0,
                    sync_issues: 0,
                    tickets_created: ticketsCreated
                  }
                })
                .eq('id', RUN_ID);

              if (updateErr) console.error('Failed to update agent_run:', updateErr.message);
              else console.log(`agent_run ${RUN_ID} marked as completed`);

              // Summary
              console.log('\n=== SUMMARY ===');
              console.log(`RUN_ID: ${RUN_ID}`);
              console.log(`validation_results inserted: ${1 + missingKeywordSlugs.length + shortDescriptions.length + 1 + keywordNotInDescSlugs.length}`);
              console.log(`  - 1 build pass`);
              console.log(`  - ${missingKeywordSlugs.length} frontmatter warnings (mainKeyword manquant)`);
              console.log(`  - ${shortDescriptions.length} seo_meta warnings (description courte)`);
              console.log(`  - 1 seo_meta warning (titre trop long)`);
              console.log(`  - ${keywordNotInDescSlugs.length} seo_meta warnings (mainKeyword absent de la description)`);
              console.log(`correction_tickets created: ${ticketsCreated}`);
            }
          }

          main().catch(err => { console.error('Fatal:', err); process.exit(1); });
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
