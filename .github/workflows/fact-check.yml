name: "Agent Fact-Check GLP1"

on:
  # Exécution hebdomadaire : lundi 8h (heure de Paris = 7h UTC en hiver, 6h UTC en été)
  schedule:
    - cron: "0 7 * * 1"

  # Déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre max d'articles à vérifier (0 = tous)"
        required: false
        default: "0"
      article_id:
        description: "UUID d'un article spécifique (optionnel)"
        required: false
        default: ""

jobs:
  fact-check:
    name: "Fact-check des articles"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Synchronisation articles vers Supabase
        run: npm run sync:articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Exécution du fact-check
        id: factcheck
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.article_id }}" != "" ]; then
            ARGS="$ARGS --article-id ${{ github.event.inputs.article_id }}"
          fi
          node scripts/fact-check-runner.mjs $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
