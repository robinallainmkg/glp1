name: Sync GA4 + GSC → Supabase

on:
  schedule:
    # Tous les jours à 6h UTC (8h Paris) — avant la routine analytics de midi
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync'
        required: false
        default: '3'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account credentials
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GA_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ga-sa.json"

      - name: Sync Analytics
        env:
          # Auth via service account (plus de refresh token OAuth qui expire)
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga-sa.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync-analytics.mjs --days ${{ github.event.inputs.days || '3' }}
