name: "Agent SEO Opportunity Finder"

on:
  # Analyse hebdomadaire le mercredi a 6h UTC (8h Paris)
  schedule:
    - cron: "0 6 * * 3"

  # Declenchement manuel
  workflow_dispatch:
    inputs:
      focus:
        description: "Focus de l'analyse (all, new, enrich)"
        required: false
        default: "all"

jobs:
  seo-analysis:
    name: "Analyse des opportunites SEO"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dependances
        run: npm ci

      - name: Execution de l'agent SEO
        id: seo
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.focus }}" != "" ] && [ "${{ github.event.inputs.focus }}" != "all" ]; then
            ARGS="$ARGS --focus ${{ github.event.inputs.focus }}"
          fi
          node scripts/seo-opportunity-agent.mjs $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
