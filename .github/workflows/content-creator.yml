name: "Agent Content Creator GLP1"

on:
  # Execution quotidienne a 10h UTC (12h Paris) — apres l'editorial (9h)
  schedule:
    - cron: "0 10 * * *"

  # Declenchement manuel
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre max d'articles a creer (0 = tous approuves)"
        required: false
        default: "0"
      id:
        description: "UUID d'une opportunite specifique (optionnel)"
        required: false
        default: ""

jobs:
  content-creation:
    name: "Creation de contenu"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dependances
        run: npm ci

      - name: Execution de l'agent content creator
        id: creator
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.id }}" != "" ]; then
            ARGS="$ARGS --opportunity-id ${{ github.event.inputs.id }}"
          fi
          node scripts/content-creator-agent.mjs $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit et push des nouveaux articles
        if: success()
        run: |
          git config user.name "content-creator-bot"
          git config user.email "bot@glp1-france.fr"
          git add src/content/
          if git diff --staged --quiet; then
            echo "Aucun nouveau fichier a commiter"
          else
            git commit -m "feat: auto-generated articles by content-creator agent"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATEHERE }}

      - name: Rapport de run
        if: always()
        run: |
          echo "## Agent Content Creator" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metrique | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Articles a traiter | ${{ steps.creator.outputs.total || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Articles crees | ${{ steps.creator.outputs.created || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Erreurs | ${{ steps.creator.outputs.errors || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: https://glp1-france.fr/admin/content-creator/" >> $GITHUB_STEP_SUMMARY

      - name: Notification email
        if: always()
        run: |
          node -e "
          const nodemailer = require('nodemailer');
          if (!process.env.SMTP_HOST || !process.env.ALERT_EMAIL_TO) {
            console.log('SMTP non configure - skip email');
            process.exit(0);
          }
          const transporter = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port: parseInt(process.env.SMTP_PORT || '587'),
            secure: process.env.SMTP_PORT === '465',
            auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS }
          });
          const created = '${{ steps.creator.outputs.created || 0 }}';
          const errors = '${{ steps.creator.outputs.errors || 0 }}';
          transporter.sendMail({
            from: process.env.SMTP_USER,
            to: process.env.ALERT_EMAIL_TO,
            subject: '[GLP1] Content Creator — ' + created + ' article(s) cree(s)' + (errors > 0 ? ' (' + errors + ' erreurs)' : ''),
            text: 'L agent Content Creator a termine.\n\nArticles crees: ' + created + '\nErreurs: ' + errors + '\n\nDashboard: https://glp1-france.fr/admin/content-creator/\nActions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }).then(() => console.log('Email envoye')).catch(e => console.log('Email skip:', e.message));
          " 2>/dev/null || echo "Email notification skipped"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
