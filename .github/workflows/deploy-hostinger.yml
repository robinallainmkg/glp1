name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      # Ignore: .claude/agents/*, scripts/*, n8n/*, supabase/*, CLAUDE.md

# CRITICAL: Cancel any in-progress deploy when a new push arrives
# Only the latest commit gets deployed — no wasted FTP transfers
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Astro site
      run: npm run astro:build

    - name: Deploy via lftp
      run: |
        sudo apt-get install -y -qq lftp > /dev/null 2>&1
        lftp -u u403023291,${{ secrets.FTP_PASSWORD }} ftp://147.79.98.140 -e "
          set ftp:passive-mode yes;
          set ftp:ssl-allow no;
          set ssl:verify-certificate no;
          set net:timeout 30;
          set net:max-retries 10;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1;
          set mirror:parallel-transfer-count 2;
          set mirror:use-pget-n 1;
          mirror --reverse --delete --only-newer --verbose --parallel=2 ./dist/ /domains/glp1-france.fr/public_html/;
          quit
        "

    - name: Verify deployment
      if: success()
      run: |
        sleep 5
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://glp1-france.fr)
        echo "Site status: $STATUS"
        if [ "$STATUS" != "200" ]; then
          echo "Warning: site returned $STATUS"
        fi
