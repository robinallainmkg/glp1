name: Deploy to Hostinger

on:
  push:
    branches: [ production ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Astro site
      run: npm run astro:build

    - name: Deploy via lftp
      run: |
        sudo apt-get install -y -qq lftp > /dev/null 2>&1
        lftp -u u403023291,${{ secrets.FTP_PASSWORD }} ftp://147.79.98.140 -e "
          set ftp:passive-mode yes;
          set ftp:ssl-allow no;
          set net:timeout 60;
          set net:max-retries 5;
          set net:reconnect-interval-base 10;
          set mirror:parallel-transfer-count 5;
          set mirror:use-pget-n 3;
          mirror --reverse --delete --only-newer --verbose --parallel=5 ./dist/ /domains/glp1-france.fr/public_html/;
          quit
        "

    - name: Verify deployment
      if: success()
      run: |
        sleep 5
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://glp1-france.fr)
        echo "Site status: $STATUS"
        if [ "$STATUS" != "200" ]; then
          echo "Warning: site returned $STATUS"
        fi
