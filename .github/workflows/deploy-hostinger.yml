name: Deploy to Hostinger

on:
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
      # Ignore: .claude/agents/*, scripts/*, n8n/*, supabase/*, CLAUDE.md

# CRITICAL: Cancel any in-progress deploy when a new push arrives
# Only the latest commit gets deployed — no wasted FTP transfers
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Astro site
      run: npm run astro:build

    - name: Deploy via lftp (with retry)
      run: |
        sudo apt-get install -y -qq lftp > /dev/null 2>&1

        # Retry wrapper — up to 3 full attempts
        # 2-phase deploy : pages dynamiques d'abord (priorité), puis sync complet
        for ATTEMPT in 1 2 3; do
          echo "=== Deploy attempt $ATTEMPT/3 ==="

          # ÉTAPE 1/2 : pages dynamiques en priorité (collections + guides + outils + racine)
          # Exclut /pharmacies/* et /_astro/* pour aller vite sur le contenu modifié.
          # PAS de --ignore-time ici : on veut forcer la re-upload des HTML modifiés
          # même si la taille est identique (cas .jpg→.svg dans un même slot).
          echo "--- Step 1/2: dynamic content (collections, guides, root) ---"
          lftp -u u403023291,${{ secrets.FTP_PASSWORD }} ftp://147.79.98.140 -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 30;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 2;
            set mirror:parallel-transfer-count 25;
            set mirror:use-pget-n 1;
            set ftp:sync-mode off;
            set xfer:clobber yes;
            mirror --reverse --verbose --no-perms --parallel=25 --only-newer --exclude-glob 'pharmacies/*' --exclude-glob '_astro/*' ./dist/ /domains/glp1-france.fr/public_html/;
            quit
          " || echo "Step 1 had issues but continuing..."

          # ÉTAPE 2/2 : full sync (assets _astro + 22k pharmacies, byte-stable, skip si taille identique)
          echo "--- Step 2/2: full sync (assets + pharmacies) ---"
          lftp -u u403023291,${{ secrets.FTP_PASSWORD }} ftp://147.79.98.140 -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 30;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 2;
            set mirror:parallel-transfer-count 25;
            set mirror:use-pget-n 1;
            set ftp:sync-mode off;
            set xfer:clobber yes;
            mirror --reverse --delete --verbose --no-perms --parallel=25 --ignore-time --continue ./dist/ /domains/glp1-france.fr/public_html/;
            quit
          " && echo "Deploy SUCCESS on attempt $ATTEMPT" && exit 0

          echo "Attempt $ATTEMPT failed, waiting 15s..."
          sleep 15
        done

        echo "All 3 deploy attempts failed"
        exit 1

    - name: Verify deployment
      if: success()
      run: |
        sleep 5
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://glp1-france.fr)
        echo "Site status: $STATUS"
        if [ "$STATUS" != "200" ]; then
          echo "Warning: site returned $STATUS"
        fi
