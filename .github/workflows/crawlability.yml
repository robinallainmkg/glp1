name: "Analyse de crawlabilite"

on:
  # Apres chaque deploy sur production
  workflow_run:
    workflows: ["Deploy to Hostinger"]
    types: [completed]
    branches: [production]

  # Declenchement manuel
  workflow_dispatch:

jobs:
  crawlability:
    name: "Analyse crawlabilite du site"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dependances
        run: npm ci

      - name: Build Astro
        run: npm run astro:build

      - name: Analyse de crawlabilite
        run: node scripts/crawlability-analysis.mjs --json

      - name: Upload rapport JSON
        uses: actions/upload-artifact@v4
        with:
          name: crawlability-report
          path: crawlability-report.json
          retention-days: 30

      - name: Upload AUDIT-TECHNIQUE.md
        uses: actions/upload-artifact@v4
        with:
          name: audit-technique
          path: AUDIT-TECHNIQUE.md
          retention-days: 30
